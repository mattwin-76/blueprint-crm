<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Blueprint CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #EAF0F6;
    --grid: rgba(34, 86, 150, 0.07);
    --panel: #FFFFFF;
    --panel-2: #F4F7FB;
    --ink: #0E1C2B;
    --muted: #586A7E;
    --line: #D3DEEA;
    --line-strong: #B7C7D9;
    --accent: #1D5FA8;
    --accent-2: #1D5FA8;
    --accent-soft: rgba(29, 95, 168, 0.10);
    --on-accent: #FFFFFF;
    --good: #147A4A; --good-soft: #DDF2E6;
    --warn: #8C5B00; --warn-soft: #FBEFD6;
    --bad: #A6362A; --bad-soft: #F9E0DC;
    --info: #1D5FA8; --info-soft: #E1ECF8;
    --shadow: 0 1px 2px rgba(14, 28, 43, 0.06), 0 8px 24px -12px rgba(14, 28, 43, 0.18);
    --map-land: #F7FAFD;
    --map-line: #9DB4CC;
    --map-water: #D6E6F2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0A1520;
      --grid: rgba(120, 170, 230, 0.06);
      --panel: #0F1D2B;
      --panel-2: #132436;
      --ink: #E4ECF4;
      --muted: #8FA2B6;
      --line: #1F3348;
      --line-strong: #2C4560;
      --accent-soft: rgba(120, 170, 230, 0.12);
      --good: #62D39B; --good-soft: rgba(98, 211, 155, 0.13);
      --warn: #F0BE5C; --warn-soft: rgba(240, 190, 92, 0.13);
      --bad: #F29484; --bad-soft: rgba(242, 148, 132, 0.13);
      --info: #8CC0F2; --info-soft: rgba(140, 192, 242, 0.13);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px -14px rgba(0, 0, 0, 0.6);
      --map-land: #102132;
      --map-line: #3C5E80;
      --map-water: #07121C;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0A1520;
    --grid: rgba(120, 170, 230, 0.06);
    --panel: #0F1D2B;
    --panel-2: #132436;
    --ink: #E4ECF4;
    --muted: #8FA2B6;
    --line: #1F3348;
    --line-strong: #2C4560;
    --accent-soft: rgba(120, 170, 230, 0.12);
    --good: #62D39B; --good-soft: rgba(98, 211, 155, 0.13);
    --warn: #F0BE5C; --warn-soft: rgba(240, 190, 92, 0.13);
    --bad: #F29484; --bad-soft: rgba(242, 148, 132, 0.13);
    --info: #8CC0F2; --info-soft: rgba(140, 192, 242, 0.13);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px -14px rgba(0, 0, 0, 0.6);
    --map-land: #102132;
    --map-line: #3C5E80;
      --map-water: #07121C;
  }

  html, body { min-height: 100%; }
  body {
    background-color: var(--ground);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink);
    font-family: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    font-size: 14.5px; line-height: 1.5;
    padding-inline: 16px; padding-block: 16px;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-family: "Archivo", "Segoe UI", system-ui, sans-serif; font-stretch: 88%; letter-spacing: -0.01em; }
  p { margin: 0; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) {
    .fade { animation: fade .25s ease both; }
    @keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .btn, .chip, .nav button, .card { transition: background-color .15s, border-color .15s, color .15s, transform .15s; }
  }

  .app { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 16px; }

  /* ---------- Sidebar ---------- */
  .side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 16px; align-self: start; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 2px 4px; }
  .logo svg { flex-shrink: 0; }
  .logo h1 { font-size: 1.3rem; font-weight: 800; font-stretch: 80%; letter-spacing: 0; line-height: 1; }
  .logo span { display: block; font-family: "JetBrains Mono", monospace; font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
  .switch { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
  .switch label { font-family: "JetBrains Mono", monospace; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .switch select { width: 100%; padding: 9px 10px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--panel-2); font-weight: 600; }
  .switch .kind { font-size: 0.8rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; border: 1px solid transparent; background: none; cursor: pointer; text-align: left; color: var(--muted); font-weight: 500; }
  .nav button svg { flex-shrink: 0; opacity: 0.85; }
  .nav button:hover { color: var(--ink); background: var(--panel); }
  .nav button[aria-current="page"] { color: var(--ink); background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); font-weight: 600; }
  .nav button[aria-current="page"] svg { color: var(--accent); opacity: 1; }
  .nav .count { margin-left: auto; font-size: 0.7rem; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .titleblock { border: 1px solid var(--line-strong); border-radius: 10px; font-family: "JetBrains Mono", monospace; font-size: 0.66rem; color: var(--muted); display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; background: var(--panel); }
  .titleblock div { padding: 6px 8px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
  .titleblock div:nth-child(2n) { border-right: none; }
  .titleblock div:nth-last-child(-n+2) { border-bottom: none; }
  .titleblock b { display: block; color: var(--ink); font-weight: 500; font-size: 0.72rem; }

  /* ---------- Main ---------- */
  .main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .head .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  .head h2 { font-size: 1.75rem; font-weight: 700; line-height: 1.1; margin-top: 2px; }
  .head p { color: var(--muted); max-width: 70ch; margin-top: 4px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
  .panel-title { font-family: "JetBrains Mono", monospace; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
  .banner { font-size: 0.84rem; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 12px; padding: 9px 13px; background: color-mix(in srgb, var(--panel) 60%, transparent); }
  .banner b { color: var(--ink); }

  /* KPI chips (clickable filters) */
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 1px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .chip::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--tone, var(--line-strong)); }
  .chip .v { font-family: "Archivo", sans-serif; font-stretch: 85%; font-size: 1.55rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .chip .l { font-family: "JetBrains Mono", monospace; font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .chip .x { font-size: 0.74rem; color: var(--muted); }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; font-size: 0.88rem; font-weight: 500; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); color: var(--on-accent); }
  .btn.small { padding: 4px 9px; font-size: 0.8rem; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }

  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.info { background: var(--info-soft); color: var(--info); }
  .pill.plain { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
  .pill.fb { background: #1877F2; color: #fff; }
  .pill.hot { background: var(--bad-soft); color: var(--bad); }

  /* Leads list */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .search { flex: 1; min-width: 180px; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th { text-align: left; font-family: "JetBrains Mono", monospace; font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover td { background: var(--panel-2); }
  td.r, th.r { text-align: right; }
  .who b { display: block; }
  .who span { font-size: 0.8rem; color: var(--muted); }

  /* Pipeline */
  .board-wrap { overflow-x: auto; padding-bottom: 8px; }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(232px, 1fr); gap: 12px; min-width: min-content; }
  .col { background: color-mix(in srgb, var(--panel) 55%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 180px; }
  .col h3 { font-size: 0.95rem; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; padding: 2px 4px 6px; border-bottom: 2px solid var(--stage, var(--line-strong)); }
  .col h3 small { font-family: "JetBrains Mono", monospace; font-size: 0.7rem; color: var(--muted); font-weight: 400; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 11px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; text-align: left; width: 100%; box-shadow: var(--shadow); }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card .t { font-weight: 600; line-height: 1.25; }
  .card .s { font-size: 0.8rem; color: var(--muted); }
  .card .foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }

  /* Map */
  .map-wrap { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--panel-2); }
  .map-wrap svg { display: block; width: 100%; height: auto; max-width: 100%; }
  .pin { cursor: pointer; }
  .pin:hover circle { stroke-width: 3; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

  /* Drawer */
  .scrim { position: fixed; inset: 0; background: rgba(6, 14, 22, 0.45); z-index: 10; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100%); z-index: 11; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: -20px 0 50px -30px rgba(0,0,0,.5); }
  .drawer-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; background: linear-gradient(180deg, var(--accent-soft), transparent); }
  .drawer-head h3 { font-size: 1.35rem; font-weight: 700; }
  .drawer-body { padding: 16px 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
  .stepper { display: flex; gap: 4px; flex-wrap: wrap; }
  .stepper span { font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
  .stepper span.done { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .stepper span.now { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 0.76rem; color: var(--muted); font-weight: 600; }
  .field input, .field select, .field textarea { padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--panel-2); width: 100%; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .checks label { display: flex; gap: 6px; align-items: center; font-size: 0.88rem; }
  .quote { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .quote .qh { padding: 10px 12px; background: var(--panel-2); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 0.84rem; }
  .quote td { padding: 8px 12px; }
  .quote .total td { font-weight: 700; font-size: 1rem; }
  .alert { padding: 10px 12px; border-radius: 10px; font-size: 0.86rem; }
  .alert.warn { background: var(--warn-soft); color: var(--warn); }
  .alert.bad { background: var(--bad-soft); color: var(--bad); }
  .alert.good { background: var(--good-soft); color: var(--good); }
  .alert.info { background: var(--info-soft); color: var(--info); }
  .log { font-size: 0.84rem; display: flex; flex-direction: column; gap: 7px; }
  .log div { display: grid; grid-template-columns: 96px 1fr; gap: 8px; }
  .qa { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; font-size: 0.88rem; }
  .qa .yn { display: flex; gap: 4px; }
  .qa .yn button { padding: 3px 10px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--panel); cursor: pointer; font-size: 0.8rem; }
  .qa .yn button[aria-pressed="true"].yes { background: var(--good-soft); color: var(--good); border-color: transparent; font-weight: 600; }
  .qa .yn button[aria-pressed="true"].no { background: var(--bad-soft); color: var(--bad); border-color: transparent; font-weight: 600; }

  /* Inbox, ads, ask */
  .draft pre { white-space: pre-wrap; margin: 0; font-family: inherit; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .draft textarea { width: 100%; min-height: 180px; padding: 10px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel-2); resize: vertical; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .listing { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); max-width: 420px; }
  .listing .img { aspect-ratio: 4 / 3; max-width: 100%; background: var(--panel-2); display: grid; place-items: center; }
  .listing .img svg { width: 80%; height: auto; }
  .listing .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .listing .price { font-size: 1.3rem; font-weight: 700; font-family: "Archivo", sans-serif; }
  .listing .desc { white-space: pre-wrap; font-size: 0.88rem; color: var(--muted); }
  .faq details { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .faq details:last-child { border-bottom: none; }
  .faq summary { cursor: pointer; font-weight: 600; }
  .faq p { margin-top: 6px; color: var(--muted); }
  .answer { white-space: pre-wrap; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }

  /* Schedule */
  .sched { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 660px; }
  .sched > div { background: var(--panel); padding: 8px; font-size: 0.8rem; min-height: 56px; }
  .sched .h { background: var(--panel-2); font-weight: 600; min-height: 0; }
  .slot { display: block; border-radius: 7px; padding: 4px 7px; margin-bottom: 4px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .slot.free { background: none; color: var(--muted); border: 1px dashed var(--line-strong); font-weight: 400; }

  /* Blueprint */
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .mode { border: 1px solid var(--line-strong); border-radius: 12px; padding: 12px; cursor: pointer; background: var(--panel); text-align: left; display: flex; flex-direction: column; gap: 3px; }
  .mode b { font-size: 0.95rem; }
  .mode span { font-size: 0.8rem; color: var(--muted); }
  .mode[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .mode:disabled { opacity: 0.45; cursor: not-allowed; }
  .bp-yaml { font-family: "JetBrains Mono", monospace; font-size: 0.78rem; white-space: pre; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; overflow-x: auto; margin: 0; }
  .compare td:first-child { font-weight: 600; white-space: nowrap; }
  .compare td.cur { background: var(--accent-soft); }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--ink); color: var(--panel); padding: 11px 16px; border-radius: 12px; font-size: 0.9rem; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

  @media (max-width: 1060px) { .split { grid-template-columns: 1fr; } }
  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; min-width: 0; }
    .nav { flex-direction: row; overflow-x: auto; }
    .nav button { white-space: nowrap; }
    .titleblock { display: none; }
    .head h2 { font-size: 1.45rem; }
  }

  /* ---------- v0.3 additions ---------- */
  .topbar { display: flex; gap: 10px; align-items: center; }
  .omni { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px; padding: 0 12px; box-shadow: var(--shadow); }
  .omni input { flex: 1; border: none; background: none; padding: 11px 0; outline: none; min-width: 0; }
  .omni kbd { font-family: "JetBrains Mono", monospace; font-size: 0.68rem; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  .cal-wrap { overflow-x: auto; }
  .cal { display: grid; position: relative; min-width: 520px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
  .cal .ch { background: var(--panel-2); border-bottom: 1px solid var(--line); padding: 8px 10px; font-weight: 600; font-size: 0.85rem; position: sticky; top: 0; z-index: 2; }
  .cal .ch small { display: block; font-weight: 400; color: var(--muted); font-size: 0.74rem; }
  .cal .tm { font-family: "JetBrains Mono", monospace; font-size: 0.68rem; color: var(--muted); padding: 0 6px; border-right: 1px solid var(--line); background: var(--panel-2); }
  .cal .cell { border: none; border-top: 1px dashed color-mix(in srgb, var(--line) 70%, transparent); background: none; padding: 0; cursor: default; min-height: 0; }
  .cal .cell.hr { border-top: 1px solid var(--line); }
  .cal .cell.bookable { cursor: pointer; }
  .cal .cell.bookable:hover { background: var(--accent-soft); }

  "chat.disclosure": ["Hi! I'm {biz}'s automated assistant — I'm AI, not a person. I answer from {biz}'s own info and can connect you with a real person anytime. Just type \"person.\"", "Olá! Sou o assistente automático da {biz} — sou uma IA, não uma pessoa. Respondo com base nas informações da própria {biz} e posso chamar uma pessoa de verdade a qualquer momento. É só digitar \"pessoa\"."],
  "chat.recording": ["This chat is recorded and saved by {biz} and its service providers (including Blueprint CRM and our AI provider) so we can answer you and follow up. Please don't share health, payment, or other sensitive info. By clicking \"Start chat,\" you agree to this. See our Privacy Policy.", "Este chat é gravado e armazenado pela {biz} e por seus prestadores de serviço (incluindo o Blueprint CRM e nosso provedor de IA) para podermos responder e dar retorno. Não compartilhe informações de saúde, de pagamento ou outros dados sensíveis. Ao clicar em \"Iniciar chat\", você concorda com isso. Veja nossa Política de Privacidade."],
  "chat.handoff": ["I'm passing you to a person at {biz}. They'll reply here or by text, email or phone, usually within one business day during business hours ({hours}). If this is an emergency, call 911. What's your name and the best way to reach you?", "Vou passar você para uma pessoa da {biz}. Ela responderá aqui ou por SMS, e-mail ou telefone, normalmente em até um dia útil, no horário comercial ({hours}). Em caso de emergência, ligue para o 911. Qual é o seu nome e a melhor forma de contato?"],
  "chat.estimate": ["Estimate only, based on the details you gave. This is not a final price or an offer. {biz} confirms your final price in writing after {review}. Taxes and fees may apply.", "Apenas uma estimativa, com base nos detalhes que você informou. Não é um preço final nem uma oferta. A {biz} confirma o preço final por escrito após {review}. Impostos e taxas podem ser aplicáveis."],
  "chat.sms": ["Yes, text me at the number above. {biz} may send appointment updates and marketing texts, including by automated means. Consent is not a condition of purchase. Msg frequency varies. Msg & data rates may apply. Reply STOP to opt out, HELP for help. See SMS Terms and Privacy Policy.", "Sim, quero receber SMS no número acima. A {biz} pode enviar atualizações de agendamento e mensagens de marketing, inclusive por meios automatizados. O consentimento não é condição para compra. A frequência das mensagens varia. Podem ser cobradas tarifas de mensagens e dados. Responda STOP para sair e HELP para ajuda. Veja os Termos de SMS e a Política de Privacidade."],
  "chat.email": ["Email me news and offers from {biz}. Unsubscribe anytime.", "Quero receber por e-mail novidades e ofertas da {biz}. Cancele quando quiser."],
  "chat.privacy": ["We use your name, contact info, ZIP, and this chat to respond to you, schedule, and follow up. {biz} uses service providers, including an AI provider, to run this chat. See our Privacy Policy for details and your choices.", "Usamos seu nome, contato, CEP (ZIP) e este chat para responder, agendar e dar retorno. A {biz} usa prestadores de serviço, incluindo um provedor de IA, para operar este chat. Veja nossa Política de Privacidade para detalhes e suas opções."],
  "chat.noQuote": ["Moving prices depend on an in-home or virtual survey, so I can't quote here. I'll pass you to a person who can.", "Os preços de mudança dependem de uma vistoria presencial ou virtual, então não consigo passar um orçamento aqui. Vou passar você para uma pessoa que pode ajudar."],
  "chat.reviewInspect": ["an inspection", "uma vistoria"], "chat.reviewJob": ["reviewing your job", "analisar o seu serviço"],
  "chat.prices": ["Prices", "Preços"], "chat.openTimes": ["Open times", "Horários livres"], "chat.person": ["Talk to a person", "Falar com uma pessoa"],
  "chat.fullyBooked": ["We're fully booked for the next two weeks. Leave your info and we'll reach out as soon as something opens.", "Estamos com a agenda cheia nas próximas duas semanas. Deixe seus dados e avisamos assim que abrir um horário."],
  "chat.nextTimes": ["Here are the next open {w} times. Pick one and I'll request it for you (our team confirms):", "Estes são os próximos horários livres ({w}). Escolha um e eu faço o pedido para você (nossa equipe confirma):"],

function t(key, vars) {
